name: Deploy GitHub Pages site

on:
  workflow_dispatch:
    inputs:
      publish_to_pages:
        description: Publish only after the assembled artifact has been reviewed
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.13.0 <23'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: pnpm build:project
        working-directory: website
      - run: pnpm p19:validate
        working-directory: website
      - run: pnpm p19:browser
        working-directory: website
      - run: pnpm p14:smoke -- --local dist
        working-directory: website
      - run: node scripts/assemble-pages-artifact.mjs
      - run: node scripts/validate-p18-privacy.mjs
        working-directory: website
      - run: node scripts/p18-browser-smoke.mjs
        working-directory: website
      - uses: actions/upload-artifact@v7
        with:
          name: pages-preview
          path: _site
          include-hidden-files: true
          retention-days: 3
      - uses: actions/configure-pages@v6
        if: inputs.publish_to_pages
      - uses: actions/upload-pages-artifact@v5
        if: inputs.publish_to_pages
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        if: inputs.publish_to_pages
        uses: actions/deploy-pages@v5
      - name: Smoke check deployed project routes and assets
        if: inputs.publish_to_pages
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: pnpm p14:smoke -- --url "$PAGES_URL"
        working-directory: website
      - name: Verify deployed preservation of original materials
        if: inputs.publish_to_pages
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke-pages-deployed.mjs --url "$PAGES_URL"
