name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.13.0 <23'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: node scripts/validate-content-model.mjs
        working-directory: website
      - run: node scripts/run-astro.mjs check
        working-directory: website
      - run: node scripts/build-profile.mjs root
        working-directory: website
      - run: node scripts/build-profile.mjs project
        working-directory: website
      - run: node scripts/validate-p19-finder.mjs
        working-directory: website
      - run: node scripts/p19-browser-smoke.mjs
        working-directory: website
      - run: node scripts/p14-pages-smoke.mjs --local dist
        working-directory: website
      - run: node scripts/assemble-pages-artifact.mjs
      - run: node scripts/validate-p18-privacy.mjs
        working-directory: website
      - run: node scripts/p18-browser-smoke.mjs
        working-directory: website
