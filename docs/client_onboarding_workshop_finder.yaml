version: '1.0'
language: nl
name: Client onboarding en workshop finder
purpose: 'Bezoekers via een korte beslisboom naar bestaande, gepubliceerde keynotes en nascholingen leiden. De website presenteert drie inhoudelijke hoofdcategorieën. Persona, duurtijd en groepsgrootte verfijnen de aanbeveling, maar creëren nooit nieuwe workshops.

  '
source_scope:
  analysed_pages:
  - id: workshops_en_nascholingen
    path: /onderwijs/workshops-en-nascholingen
    role: Enige bron voor bookable_offers.
  - id: onderwijs
    path: /onderwijs
    role: Bron voor supporting_projects en inhoudelijke positionering.
  - id: boek
    path: /boek
    role: Ondersteunende inhoudelijke positionering; geen bookable_offer.
  research_date: '2026-09-23'
guardrails:
- Alleen items die op de huidige pagina Workshops en Nascholingen staan mogen als bookable_offer worden aanbevolen.
- Projecten en artikels op /onderwijs zijn supporting_content, tenzij dezelfde titel of sessie ook expliciet als nascholing is gepubliceerd.
- Een project wordt nooit automatisch omgezet in een workshop.
- Onbekende maximale groepsgroottes worden als null bewaard en mogen niet worden verzonnen.
- Bij tegenstrijdige duurtijden op de huidige website wordt het conflict expliciet bewaard.
- Prijs maakt geen deel uit van de finder; de CTA leidt naar een contactformulier.
- Categorie gaat over inhoud, niet over presentatievorm. Een keynotevariant kan dus inhoudelijk onder AI-geletterdheid of vakspecifiek vallen.
categories:
  keynote_inspiratie:
    label: Keynotes & inspiratie
    customer_question: Ik zoek een breed kader dat mijn publiek aan het denken zet.
    role_in_offer: Breedste en meest conceptuele ingang.
    flagship_offer_id: kennis_in_tijden_van_ai
    bookable_offer_ids:
    - kennis_in_tijden_van_ai
    - ai_in_de_klas_van_lesmateriaal_tot_leerlijn
  ai_geletterdheid_onderwijspraktijk:
    label: AI-geletterdheid & onderwijspraktijk
    customer_question: Ik wil praktisch en kritisch met AI aan de slag in onderwijs.
    role_in_offer: Algemene professionalisering voor onderwijsprofessionals, niet vakspecifiek.
    flagship_offer_id: putting_the_chat_in_chatgpt
    bookable_offer_ids:
    - putting_the_chat_in_chatgpt
    - chatgpt_vergiftigd_geschenk
    planned_consolidation:
      status: future_information_architecture
      note: 'De gebruiker wil ChatGPT: Een (Vergiftigd) Geschenk voor Leraar en Leerling? op termijn inhoudelijk samenbrengen met Putting the chat in ChatGPT. Dit YAML-bestand houdt beide huidige gepubliceerde sessies apart, zodat de huidige website niet verkeerd wordt voorgesteld.

        '
      merge_candidate_id: chatgpt_vergiftigd_geschenk
      primary_future_offer_id: putting_the_chat_in_chatgpt
      user_proposed_future_label: Putting the chat in ChatGPT en andere taalmodellen
      published_title_remains: Putting the chat in ChatGPT
  vakspecifieke_professionalisering:
    label: Vakspecifieke professionalisering
    customer_question: Ik zoek een sessie die aansluit bij een concreet vak- of technologiedomein.
    role_in_offer: Verdieping binnen een vakgebied of technische leerlijn.
    subcategories:
      talen:
        label: Talen & schrijven
        bookable_offer_ids:
        - schrijftaken_zonder_aiaiai
        - ai_en_taaltechnologie
      klassieke_talen:
        label: Klassieke talen
        bookable_offer_ids:
        - ai_en_latijn_breng_tacitus_tot_leven
        - latijnse_inscripties_en_ai
        - grieks_en_ai_een_knap_duo
        - minecraft_en_klassieke_talen
      computationeel_denken_programmeren:
        label: Computationeel denken & programmeren
        bookable_offer_ids:
        - python_in_de_klas
      stem_digitale_technologie:
        label: STEM & digitale technologie
        bookable_offer_ids:
        - ai_in_de_klas_van_a_tot_zwerfvuil
      geschiedenis:
        label: Geschiedenis
        bookable_offer_ids: []
        note: 'Er staan wel relevante projecten op /onderwijs, maar momenteel geen afzonderlijke geschiedenisnascholing op de gepubliceerde nascholingenpagina.

          '
personas:
  schoolleider_beleid:
    label: Schoolleider / beleidsteam
    intent: Een sessie kiezen voor een schoolteam of bredere schoolontwikkeling.
    ranking_preferences:
    - kennis_in_tijden_van_ai
    - ai_in_de_klas_van_lesmateriaal_tot_leerlijn
    - putting_the_chat_in_chatgpt
    note: Persona beïnvloedt ranking, maar sluit vakspecifieke sessies niet uit.
  eventorganisator:
    label: Eventorganisator / studiedagcoördinator
    intent: Een sessie kiezen die past bij programma, publiek, tijdslot en groepsgrootte.
    ranking_preferences:
    - kennis_in_tijden_van_ai
    - ai_in_de_klas_van_lesmateriaal_tot_leerlijn
    - ai_in_de_klas_van_a_tot_zwerfvuil
  leerkracht_vakgroep:
    label: Leerkracht / vakgroep
    intent: Een concrete professionalisering vinden voor eigen klas- of vakpraktijk.
    ranking_preferences:
    - putting_the_chat_in_chatgpt
    - subject_match_first
onboarding_questions:
  q1_persona:
    order: 1
    prompt: Wie ben je?
    type: single_select
    required: true
    options:
    - id: schoolleider_beleid
      label: Schoolleider / beleidsteam
    - id: eventorganisator
      label: Eventorganisator / studiedagcoördinator
    - id: leerkracht_vakgroep
      label: Leerkracht / vakgroep
  q2_need:
    order: 2
    prompt: Waar ben je naar op zoek?
    type: single_select
    required: true
    options:
    - id: breed_kader
      label: Een keynote of breed inspirerend kader
      route_to_category: keynote_inspiratie
    - id: praktisch_ai
      label: Praktisch en kritisch werken met AI
      route_to_category: ai_geletterdheid_onderwijspraktijk
    - id: vakspecifiek
      label: Een vakspecifieke workshop
      route_to_category: vakspecifieke_professionalisering
  q2b_subject:
    order: 2.1
    show_if:
      q2_need: vakspecifiek
    prompt: Binnen welk domein wil je werken?
    type: single_select
    required_when_visible: true
    options:
    - id: talen
      label: Talen & schrijven
    - id: klassieke_talen
      label: Klassieke talen
    - id: computationeel_denken_programmeren
      label: Computationeel denken & programmeren
    - id: stem_digitale_technologie
      label: STEM & digitale technologie
    - id: geschiedenis
      label: Geschiedenis
      result_behavior: 'Toon alleen supporting_projects en meld dat er momenteel geen afzonderlijke geschiedenisnascholing in het gepubliceerde nascholingsaanbod staat.

        '
  q3_duration:
    order: 3
    prompt: Hoeveel tijd heb je ter beschikking?
    type: single_select
    required: true
    options:
    - id: ongeveer_90_min
      label: Ongeveer 90 minuten
      target_minutes:
        min: 75
        max: 105
    - id: ongeveer_2_uur
      label: Ongeveer 2 uur
      target_minutes:
        min: 105
        max: 135
    - id: dagdeel
      label: Een dagdeel (ongeveer 2,5–3 uur)
      target_minutes:
        min: 135
        max: 195
    - id: volledige_dag
      label: Een volledige dag
      target_minutes:
        min: 270
        max: 390
    - id: flexibel
      label: Ik ben flexibel
      target_minutes: null
  q4_group_size:
    order: 4
    prompt: Hoe groot is de groep?
    type: single_select
    required: true
    options:
    - id: tot_15
      label: Tot 15 deelnemers
      min: 1
      max: 15
    - id: '16_30'
      label: 16–30 deelnemers
      min: 16
      max: 30
    - id: '31_100'
      label: 31–100 deelnemers
      min: 31
      max: 100
    - id: meer_dan_100
      label: Meer dan 100 deelnemers
      min: 101
      max: null
      note: 'Geen huidige sessie publiceert expliciet een maximum boven 100. Geef daarom geen harde automatische match; stuur door naar contact.

        '
recommendation_logic:
  hard_filters:
  - q2_need bepaalt de primaire category.
  - q2b_subject bepaalt de subcategory wanneer vakspecifiek is gekozen.
  - Een expliciete gepubliceerde maximumgroepsgrootte mag niet worden overschreden.
  soft_filters:
  - 'Duurtijd: exacte of dichtstbijzijnde gepubliceerde variant krijgt voorrang.'
  - 'Persona: verhoogt relevantiescore maar sluit andere inhoud niet automatisch uit.'
  - Als groepsgrootte onbekend is, toon 'groepsgrootte te bevestigen' in plaats van te gokken.
  scoring:
    category_match: 50
    subject_match: 30
    duration_match: 10
    group_size_match: 7
    persona_match: 3
  result_limit: 3
  result_order:
  - beste_match
  - alternatief
  - eventuele_verdieping
  no_match_behavior: 'Toon geen verzonnen alternatief. Toon relevante supporting_projects indien beschikbaar en leid naar het contactformulier met de geselecteerde voorkeuren ingevuld.

    '
