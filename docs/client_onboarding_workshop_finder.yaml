implementation_notes:
- 'Houd de drie categorieën zichtbaar voor bezoekers, maar bewaar formats (keynote/workshop/online/fysiek) als metadata onder het aanbod.

  '
- '''Kennis in tijden van AI'' is de enige flagship in Keynotes & inspiratie, conform de gewenste toekomstige positionering.

  '
- '''Putting the chat in ChatGPT'' is de flagship voor algemene, praktische AI-professionalisering. De oudere ChatGPT-intro blijft zolang ze op de site staat als bestaand catalogue-item, maar is gemarkeerd als merge_candidate.

  '
- 'Vakspecifieke projecten zoals Blockly, Fijnstof, Robothand en Interview met de Geschiedenis mogen als inhoudelijke voorbeelden verschijnen, maar niet als boekbare sessies tenzij ze later expliciet aan de nascholingenpagina worden toegevoegd.

  '
- '''AI in de Klas - van lesmateriaal tot leerlijn'' wordt in de nieuwe finder uitsluitend als keynote gepositioneerd onder ''Keynotes & inspiratie''. De workshopvariant blijft enkel als historische/gepubliceerde metadata bewaard.'
