research_findings:
  source_site:
    information_architecture:
      - "The primary navigation contains Dutch pages for profile, book, education, workshops, and contact."
      - "A secondary English navigation contains profile, contact, education, and projects pages."
      - "The education section is a paginated long-form article collection."
      - "The workshop page is a large catalogue with repeated structured fields such as type, duration, programme, goals, target audience, location, price, travel costs, and group size."
      - "The contact page refers to a web form, Discord community, social channels, and a support link."
      - "Articles may contain large image sequences, galleries, embedded media, external references, and downloadable teaching resources."
    migration_implications:
      - "A flat set of manually copied HTML pages is insufficient."
      - "Articles, workshops, projects, pages, navigation, assets, and site settings require separate schemas."
      - "Pagination and historical article traversal must be automated."
      - "Form handling must be replaced because GitHub Pages has no application backend."
      - "Bilingual pages require locale-aware navigation and alternate-language metadata."
  project_ecosystem:
    recurring_product_principles:
      - "No learner accounts."
      - "Privacy-first, browser-local state."
      - "Static deployment without a mandatory backend."
      - "Progressive workflows that move from prediction or reasoning to action, measurement, comparison, and reflection."
      - "Accessible skip links, semantic landmarks, clear primary actions, and responsive navigation."
      - "Project families cross-link to computation, coding, and STEaM resources."
    reusable_content_patterns:
      - "Hero with one dominant statement, short lead, and one or two actions."
      - "Numbered workflow cards."
      - "Feature or learning-goal cards."
      - "Teacher-facing practical section."
      - "Curriculum or platform-family map."
      - "Privacy and technical-requirements section."
      - "Final call-to-action band."
      - "Author, copyright, and ecosystem links in the footer."
  design_consensus:
    colours:
      brand: "#5200FF"
      brand_dark: "#3700B3"
      accent: "#3DFFD0"
      accent_variant_observed: "#03DDEF"
      ink: "#160033"
      text: "#1D1930"
      muted: "#625B70"
      background: "#F8F7F3"
      surface: "#FFFFFF"
      brand_soft: "#F7F3FF"
      line: "#E2DDEA"
      success: "#00A66A"
      warning: "#FFB000"
      danger: "#D0006F"
    typography:
      body_stack: 'system-ui, -apple-system, "Segoe UI", Arial, sans-serif'
      code_stack: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      body_line_height: 1.55
      hero_size: "clamp(2.45rem, 7vw, 5.8rem)"
      section_title_size: "clamp(1.8rem, 4vw, 3.25rem)"
      lead_size: "clamp(1.05rem, 2vw, 1.32rem)"
      heading_weight: 900
      navigation_weight: 700
    layout:
      content_max_width: "1180px"
      page_inline_padding: "22px"
      desktop_section_block_padding: "82px"
      navigation_padding: "16px 22px"
      header: "sticky, translucent white, 14px to 16px backdrop blur"
    radii:
      small: "10px"
      brand_mark: "14px"
      card: "20px"
      panel: "24px"
      hero_card: "28px"
      pill: "999px"
    shadows:
      soft: "0 18px 55px rgba(32, 20, 54, 0.10)"
      card: "0 10px 30px rgba(32, 20, 54, 0.08)"
      brand: "0 12px 24px rgba(82, 0, 255, 0.24)"
      primary_button: "0 16px 30px rgba(82, 0, 255, 0.23)"
    motion:
      fast: "150ms"
      medium: "260ms"
      slow: "520ms"
      standard_easing: "cubic-bezier(0.2, 0, 0, 1)"
      exit_or_reveal_easing: "cubic-bezier(0.22, 1, 0.36, 1)"
      recurring_hover: "translateY(-1px)"
      recurring_reveal: "opacity 0 to 1; translateY(12px) to 0"
    drift_policy:
      canonicalise:
        - "Use the consensus token values as the global design system."
        - "Record deviations found in individual projects."
        - "Preserve a deviation only when it conveys a deliberate project identity or status meaning."
        - "Do not let later CSS overrides silently redefine global tokens."
      known_drift:
        - "Some project styles use 160ms component transitions while the canonical fast token is 150ms."
        - "Some project styles use #03DDEF as the aqua accent while the majority token is #3DFFD0."
        - "Some projects redefine brand-dark with a nearby purple value."
  hosting:
    facts:
      - "GitHub Pages serves static output and supports custom GitHub Actions workflows."
      - "A custom domain may use an apex domain, a www subdomain, or both."
      - "The www subdomain is configured through DNS with a CNAME record."
      - "GitHub recommends verifying the custom domain before attaching it to the Pages site."
    consequences:
      - "The website build, CMS schemas, preview generation, and validation belong in the repository and GitHub Actions."
      - "Dynamic forms and secure OAuth publishing require a deliberately selected external service or local workflow."
      - "Exact URL preservation is preferable to relying on host-level redirect rules."

architecture:
  style: "static-site-plus-git-backed-cms"
  public_site:
    framework: "Astro"
    output: "static"
    build_profiles:
      local:
        site: "http://localhost:4321"
        base: "/"
        required_first: true
      github_project_preview:
        site: "https://robbew.github.io"
        base: "/aiindeklas/"
        activation: "Only after H3 authorises creation of RobbeW/aiindeklas."
        indexing: "noindex, nofollow until the production custom-domain cutover"
      production_custom_domain:
        site: "https://www.robbewulgaert.be"
        base: "/"
        activation: "Only after H4 authorises DNS cutover."
    rendering:
      default: "build-time"
      client_javascript_policy: "Only hydrate components that require interaction."
    content_engine:
      format:
        - "Markdown"
        - "MDX only when structured interactive blocks are required"
      validation: "Astro content collections with strict schemas"
    routing:
      rule: "Generate routes that preserve existing Squarespace paths."
      trailing_slash_policy: "Match the observed production URL behaviour and enforce one canonical form."
      base_path_policy:
        - "All internal links, assets, admin routes, feeds, and canonical helpers must be generated through a shared base-path utility."
        - "Do not hard-code root-relative URLs that fail under /aiindeklas/."
        - "The same source tree must build with base / for local and custom-domain use and with base /aiindeklas/ for the candidate GitHub project Pages preview."
    search:
      default: "build-time generated local index"
      external_service_required: false
  cms_studio:
    type: "custom schema-driven editor"
    deployment: "Base-aware static admin application: /admin/ locally and on the custom domain, /aiindeklas/admin/ on the project Pages preview."
    capabilities:
      - "Browse collections and filter by locale, status, type, tag, and publication date."
      - "Create, edit, duplicate, archive, and preview content."
      - "Edit structured workshop fields without raw frontmatter manipulation."
      - "Upload media through the controlled asset pipeline."
      - "Preview responsive pages against the production design system."
      - "Display source provenance and migration warnings."
      - "Validate required fields before publish."
      - "Generate a pull request or export a content patch."
    publishing_modes:
      github_web_editor:
        backend_required: false
        description: "Open the exact repository file in GitHub's authenticated editor."
      local_studio_with_git:
        backend_required: false
        description: "Run the studio locally and commit through local Git credentials."
      pull_request_bundle:
        backend_required: false
        description: "Export a deterministic patch bundle for an agent or authenticated GitHub workflow."
      external_oauth_bridge:
        backend_required: true
        description: >-
          Use a minimal separately hosted OAuth or GitHub App bridge to create
          branches, commits, and pull requests without exposing secrets.
        approval_required: true
    default_publish_workflow:
      - "Editor validates content."
      - "Editor creates or exports a branch patch."
      - "A pull request is opened."
      - "CI runs schema, build, accessibility, link, SEO, and visual checks."
      - "Human review approves the pull request."
      - "Merge triggers the production Pages build."
  contact:
    static_content: "Preserve contact copy, community links, and social links."
    form_replacement_decision:
      options:
        - id: "mailto"
          backend_required: false
          privacy_profile: "No form processing; opens the visitor's mail client."
        - id: "external_form_service"
          backend_required: true
          privacy_profile: "Requires processor review, privacy notice, spam control, and data retention configuration."
        - id: "serverless_form_endpoint"
          backend_required: true
          privacy_profile: "Requires a separately hosted endpoint, secret management, logging policy, and abuse controls."
      default_until_approved: "mailto"
  educational_projects:
    strategy: "catalogue-and-link"
    rules:
      - "Keep each existing project deployable in its own repository."
      - "Create structured Project entries in the main CMS."
      - "Reuse shared design tokens through a versioned design package only after compatibility tests."
      - "Do not iframe projects by default."
      - "Open external project tools with clear context and return navigation."

content_model:
  common_fields:
    id:
      type: "string"
      required: true
      rule: "Stable UUID or deterministic source-derived identifier."
    title:
      type: "string"
      required: true
    slug:
      type: "string"
      required: true
    locale:
      type: "enum"
      values: ["nl-BE", "en"]
      required: true
    translation_key:
      type: "string_or_null"
      required: true
    status:
      type: "enum"
      values: ["draft", "review", "published", "archived"]
      required: true
    source_url:
      type: "absolute_url_or_null"
      required: true
    source_html_sha256:
      type: "sha256_or_null"
      required: true
    migration_status:
      type: "enum"
      values:
        - "not_started"
        - "extracted"
        - "transformed"
        - "needs_review"
        - "approved"
        - "excluded"
      required: true
    created_at:
      type: "iso_datetime_or_null"
      required: true
    updated_at:
      type: "iso_datetime_or_null"
      required: true
    published_at:
      type: "iso_datetime_or_null"
      required: true
    author:
      type: "author_reference"
      required: true
    excerpt:
      type: "string_or_null"
      required: true
    hero:
      type: "media_reference_or_null"
      required: true
    seo:
      type: "seo_object"
      required: true
    body:
      type: "markdown_or_mdx"
      required: true
  collections:
    pages:
      path: "src/content/pages"
      extra_fields:
        template:
          values: ["home", "profile", "book", "contact", "education", "projects", "generic"]
        navigation:
          type: "navigation_placement_array"
        call_to_actions:
          type: "cta_array"
    articles:
      path: "src/content/articles"
      extra_fields:
        tags: "string_array"
        categories: "string_array"
        reading_time: "derived"
        featured: "boolean"
        previous_source_url: "url_or_null"
        next_source_url: "url_or_null"
        gallery: "media_reference_array"
        downloads: "download_reference_array"
        citations: "external_reference_array"
    workshops:
      path: "src/content/workshops"
      extra_fields:
        workshop_type: "enum[keynote, workshop, training, webinar, trajectory, other]"
        duration_minutes: "integer_or_null"
        duration_display: "string"
        summary: "string"
        programme: "rich_text"
        goals:
          knowledge: "string_array"
          skills: "string_array"
          attitudes: "string_array"
        target_audience: "rich_text"
        prerequisites: "string_array"
        delivery_modes: "enum_array[on_site, online, hybrid, cno, other]"
        location_notes: "rich_text"
        price:
          amount_eur: "decimal_or_null"
          includes_vat: "boolean_or_null"
          display: "string"
        travel_cost:
          amount_per_km_eur: "decimal_or_null"
          public_transport_policy: "string_or_null"
          display: "string"
        group_size:
          minimum: "integer_or_null"
          maximum: "integer_or_null"
          display: "string"
        booking_cta: "cta_object"
    projects:
      path: "src/content/projects"
      extra_fields:
        external_url: "absolute_url"
        repository_url: "absolute_url_or_null"
        project_family: "enum[platform, steam_project, publication, research, other]"
        target_age: "string_or_null"
        technologies: "string_array"
        learning_goals: "string_array"
        privacy_profile: "string_or_null"
        hardware: "string_array"
        featured: "boolean"
    authors:
      path: "src/content/authors"
      extra_fields:
        name: "string"
        bio: "rich_text"
        portrait: "media_reference_or_null"
        social_links: "social_link_array"
    site_settings:
      path: "src/content/settings"
      files:
        - "site.yaml"
        - "navigation.yaml"
        - "footer.yaml"
        - "social.yaml"
        - "redirects.yaml"
    media_registry:
      path: "src/content/media/media.yaml"
      fields:
        source_url: "absolute_url"
        original_path: "string"
        output_path: "string"
        sha256: "sha256"
        mime_type: "string"
        width: "integer_or_null"
        height: "integer_or_null"
        alt: "string_or_null"
        caption: "string_or_null"
        decorative: "boolean"
        rights: "string_or_null"
        used_by: "content_reference_array"

block_model:
  permitted_blocks:
    - "paragraph"
    - "heading"
    - "quote"
    - "ordered_list"
    - "unordered_list"
    - "image"
    - "gallery"
    - "figure"
    - "video_embed"
    - "audio_embed"
    - "download"
    - "callout"
    - "code"
    - "table"
    - "button_group"
    - "project_card_grid"
    - "workshop_details"
    - "timeline"
    - "research_steps"
  migration_rule: >-
    Prefer semantic Markdown. Use an explicit block component only when plain
    Markdown cannot preserve structure, interaction, captioning, or accessibility.
  forbidden_blocks:
    - "raw Squarespace layout wrappers"
    - "unreviewed arbitrary scripts"
    - "inline event handlers"
    - "opaque HTML blobs when semantic conversion is possible"

