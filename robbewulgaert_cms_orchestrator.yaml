schema_version: "1.1.0"
cookbook_id: "robbewulgaert-custom-cms-migration"
cookbook_title: "Robbe Wulgaert website migration and custom CMS orchestrator"
generated_on: "2026-07-15"
last_amended_on: "2026-07-15"
revision_summary: "Local-first build; RobbeW/aiindeklas and registrar work postponed behind owner approval gates."
primary_language: "en"
content_languages:
  - "nl-BE"
  - "en"
owner:
  name: "Robbe Wulgaert"
  copyright_holder: "Robbe Wulgaert"
  organisation: "AI in de Klas"
  enterprise_number: "BE0802831980"

mission:
  statement: >-
    First build or rebuild the website locally in the current workspace, then
    replace the current Squarespace website at robbewulgaert.be with a
    maintainable, statically hosted website and a custom Git-backed CMS.
    Migrate all public content and assets, preserve existing URLs wherever
    technically possible, and apply a consolidated design system derived from
    the owner's educational websites and projects. Remote repository creation,
    GitHub Pages publication, registrar access, and production-domain cutover
    are later steps and must not block the local build.
  success_definition:
    - "The current local folder contains a reproducible working build before any remote repository or registrar action is required."
    - "Every public source URL is discovered, classified, migrated, redirected, or explicitly excluded with a reason."
    - "The new site preserves the source meaning, media, metadata, language, attribution, and publication dates."
    - "The public website is statically generated and deployable through GitHub Actions to GitHub Pages."
    - "Content is editable through structured Markdown or MDX collections and a schema-driven CMS workflow."
    - "The visual language is recognisably derived from the referenced GitHub Pages projects."
    - "Production cutover is reversible without losing the Squarespace source snapshot."

non_goals:
  - "Do not clone Squarespace's proprietary editor or backend."
  - "Do not recreate Squarespace implementation details that have no user-facing value."
  - "Do not silently rewrite the author's prose."
  - "Do not merge the complete source code of every educational project into the main website."
  - "Do not introduce a database when Git-backed content is sufficient."
  - "Do not add tracking, advertising, or third-party scripts without an explicit architecture decision."
  - "Do not change production DNS during autonomous execution."
  - "Do not require creation of a GitHub repository or access to a registrar during local development and migration."

hard_constraints:
  hosting:
    - "The website must first build and run as static files from the current local workspace."
    - "The eventual public website must remain compatible with GitHub Pages."
    - "No server runtime may be assumed on GitHub Pages."
    - "All build-time operations must run locally or in GitHub Actions."
    - "P0 through P8 must be executable without a remote repository or registrar credentials."
  content:
    - "Original page text is authoritative."
    - "Normalisation may fix encoding, whitespace, duplicated navigation, and invalid markup only."
    - "Substantive copy edits require a separate proposed_changes artifact."
    - "Source URLs and source hashes must remain traceable after migration."
  security:
    - "Never place GitHub tokens, OAuth client secrets, API keys, form-provider secrets, or private keys in client-side code."
    - "Never commit secrets to the repository."
    - "All production writes occur through reviewed pull requests."
  release:
    - "Squarespace remains active until the production acceptance gate passes."
    - "DNS changes require human approval."
    - "A rollback plan and source backup are mandatory before cutover."

